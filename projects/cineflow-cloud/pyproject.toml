[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cineflow-cloud"
version = "0.7.0"
description = "Standalone cloud video translation, OSS ingest, subtitle removal, and cloud OCR/ASR recognition with a soft five-minute target."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "superchenchao" }]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
aliyun = [
  "aliyun-python-sdk-core>=2.16",
  "oss2>=2.19",
]
gpu = [
  "pyannote.audio>=4,<5",
  "torch>=2.6",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[project.scripts]
cineflow = "cineflow.api:run"
cineflow-upload = "cineflow.upload_client:main"
cineflow-upload-worker = "cineflow.upload_worker:run"
cineflow-subtitle-worker = "cineflow.subtitle_worker:run"
cineflow-caption-worker = "cineflow.caption_worker:run"
cineflow-asr-worker = "cineflow.asr_worker:run"
cineflow-media-worker = "cineflow.media_worker:run"
cineflow-speaker-worker = "cineflow.speaker_worker:run"

[tool.setuptools.packages.find]
include = ["cineflow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
