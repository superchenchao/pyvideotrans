apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cineflow-subtitle-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cineflow-subtitle-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cineflow-subtitle-worker
  template:
    metadata:
      labels:
        app: cineflow-subtitle-worker
    spec:
      containers:
        - name: subtitle-worker
          image: ghcr.io/OWNER/cineflow-cloud-subtitle:latest
          ports:
            - containerPort: 8095
          envFrom:
            - secretRef:
                name: cineflow-secrets
            - configMapRef:
                name: cineflow-config
          env:
            - name: CINEFLOW_SUBTITLE_STATE_DIR
              value: /var/lib/cineflow/subtitles
          volumeMounts:
            - name: state
              mountPath: /var/lib/cineflow/subtitles
            - name: local-models
              mountPath: /opt/subtitle-models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8095
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8095
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: cineflow-subtitle-state
        - name: local-models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cineflow-subtitle-worker
spec:
  selector:
    app: cineflow-subtitle-worker
  ports:
    - port: 8095
      targetPort: 8095
