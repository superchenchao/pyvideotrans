apiVersion: apps/v1
kind: Deployment
metadata:
  name: cineflow-caption-aliyun
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cineflow-caption-aliyun
  template:
    metadata:
      labels:
        app: cineflow-caption-aliyun
    spec:
      containers:
        - name: caption
          image: ghcr.io/OWNER/cineflow-cloud-caption:latest
          args:
            - uvicorn
            - cineflow.caption_worker:app
            - --host
            - 0.0.0.0
            - --port
            - "8096"
          ports:
            - containerPort: 8096
          envFrom:
            - secretRef:
                name: cineflow-secrets
            - configMapRef:
                name: cineflow-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8096
            periodSeconds: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8096
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "200m"
              memory: "192Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cineflow-caption-aliyun
spec:
  selector:
    app: cineflow-caption-aliyun
  ports:
    - port: 8096
      targetPort: 8096
