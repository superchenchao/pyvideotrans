name: CineFlow Cloud CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q -W error

  aliyun-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[aliyun]'
      - run: >-
          python -c "import cineflow.upload_worker, cineflow.subtitle_worker,
          cineflow.caption_worker, cineflow.media_worker"
