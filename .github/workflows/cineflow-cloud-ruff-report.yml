name: Temporary CineFlow Ruff Report

on:
  push:
    branches:
      - agent/cineflow-cloud-realtime-5m
    paths:
      - 'projects/cineflow-cloud/**'
      - '.github/workflows/cineflow-cloud-ruff-report.yml'

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cineflow-cloud-realtime-5m
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'ruff>=0.9'
          cd projects/cineflow-cloud
          set +e
          ruff check . --output-format=concise > ruff-report.txt
          set -e
          cd ../..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/cineflow-cloud/ruff-report.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Capture Alibaba media Ruff diagnostics'
          git push origin HEAD:agent/cineflow-cloud-realtime-5m
