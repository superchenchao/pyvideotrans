name: Temporary CineFlow Fix

on:
  push:
    branches:
      - agent/cineflow-cloud-realtime-5m
    paths:
      - '.github/workflows/cineflow-cloud-fix.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/cineflow-cloud-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cineflow-cloud-realtime-5m
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch subtitle recovery and cleanup semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('projects/cineflow-cloud/cineflow/subtitle_worker.py')
          text = path.read_text(encoding='utf-8')

          start_marker = '                submission = self._submission_from_job(job)\n'
          end_marker = '                if not has_existing_submission or provider.name == "local":\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''                submission = self._submission_from_job(job)
                  output_exists = bool(
                      submission.output_object_key
                      and await asyncio.to_thread(
                          self.store.object_exists,
                          submission.output_object_key,
                      )
                  )
                  if provider.name == "local":
                      has_existing_submission = output_exists and submission.completed
                  else:
                      has_existing_submission = bool(
                          submission.external_job_id
                          or submission.completed
                          or output_exists
                      )
                  if not has_existing_submission:
          '''
          text = text[:start] + replacement + text[end:]

          cancel_section = text.index('    async def cancel(\n')
          load_marker = '        job = await self._load(job_id)\n'
          load_at = text.index(load_marker, cancel_section) + len(load_marker)
          cancellation = '''        task = self.tasks.get(job_id)
                  if task is not None and task is not asyncio.current_task() and not task.done():
                      task.cancel()
                      await asyncio.gather(task, return_exceptions=True)
          '''
          text = text[:load_at] + cancellation + text[load_at:]

          cleanup_section = text.index('    async def cleanup(\n')
          timestamp_marker = '''            if timestamp > threshold:
                      continue
          '''
          timestamp_at = text.index(timestamp_marker, cleanup_section) + len(timestamp_marker)
          delete_start = text.index(
              '            delete_output = delete_successful_outputs or job.state not in {\n',
              timestamp_at,
          )
          try_marker = '            try:\n'
          delete_end = text.index(try_marker, delete_start)
          skip_success = '''            if job.state in {
                      SubtitleJobState.SUCCEEDED,
                      SubtitleJobState.DEGRADED,
                  } and not delete_successful_outputs:
                      continue
          '''
          text = text[:delete_start] + skip_success + text[delete_end:]
          text = text.replace(
              '                    delete_output=delete_output,\n',
              '                    delete_output=True,\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format and lint-fix
        shell: bash
        run: |
          python -m pip install --quiet 'ruff>=0.9'
          ruff format projects/cineflow-cloud
          ruff check --fix --unsafe-fixes projects/cineflow-cloud
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/cineflow-cloud
          git diff --cached --quiet && exit 0
          git commit -m 'Harden and format standalone ingest services'
          git push origin HEAD:agent/cineflow-cloud-realtime-5m
