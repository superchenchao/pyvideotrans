name: Temporary CineFlow Fix

on:
  push:
    branches:
      - agent/cineflow-cloud-realtime-5m
    paths:
      - '.github/workflows/cineflow-cloud-fix.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/cineflow-cloud-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cineflow-cloud-realtime-5m
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch subtitle recovery and cleanup semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('projects/cineflow-cloud/cineflow/subtitle_worker.py')
          text = path.read_text(encoding='utf-8')

          old = '''                submission = self._submission_from_job(job)
                  has_existing_submission = bool(
                      submission.external_job_id
                      or submission.completed
                      or (
                          submission.output_object_key
                          and await asyncio.to_thread(
                              self.store.object_exists,
                              submission.output_object_key,
                          )
                      )
                  )
                  if not has_existing_submission or provider.name == "local":
          '''
          new = '''                submission = self._submission_from_job(job)
                  output_exists = bool(
                      submission.output_object_key
                      and await asyncio.to_thread(
                          self.store.object_exists,
                          submission.output_object_key,
                      )
                  )
                  if provider.name == "local":
                      has_existing_submission = output_exists and submission.completed
                  else:
                      has_existing_submission = bool(
                          submission.external_job_id
                          or submission.completed
                          or output_exists
                      )
                  if not has_existing_submission:
          '''
          if old not in text:
              raise SystemExit('submission block not found')
          text = text.replace(old, new, 1)

          old = '''        job = await self._load(job_id)
                  provider = self.providers.get(job.selected_provider)
          '''
          new = '''        job = await self._load(job_id)
                  task = self.tasks.get(job_id)
                  if task is not None and task is not asyncio.current_task() and not task.done():
                      task.cancel()
                      await asyncio.gather(task, return_exceptions=True)
                  provider = self.providers.get(job.selected_provider)
          '''
          if old not in text:
              raise SystemExit('cancel block not found')
          text = text.replace(old, new, 1)

          old = '''            if timestamp > threshold:
                      continue
                  delete_output = delete_successful_outputs or job.state not in {
                      SubtitleJobState.SUCCEEDED,
                      SubtitleJobState.DEGRADED,
                  }
                  try:
                      await self.cancel(
                          job.job_id,
                          delete_output=delete_output,
                          delete_input=False,
                      )
          '''
          new = '''            if timestamp > threshold:
                      continue
                  if job.state in {
                      SubtitleJobState.SUCCEEDED,
                      SubtitleJobState.DEGRADED,
                  } and not delete_successful_outputs:
                      continue
                  try:
                      await self.cancel(
                          job.job_id,
                          delete_output=True,
                          delete_input=False,
                      )
          '''
          if old not in text:
              raise SystemExit('cleanup block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format and lint-fix
        shell: bash
        run: |
          python -m pip install --quiet 'ruff>=0.9'
          ruff format projects/cineflow-cloud
          ruff check --fix --unsafe-fixes projects/cineflow-cloud
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/cineflow-cloud
          git diff --cached --quiet && exit 0
          git commit -m 'Harden and format standalone ingest services'
          git push origin HEAD:agent/cineflow-cloud-realtime-5m
