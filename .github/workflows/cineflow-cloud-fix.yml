name: Temporary CineFlow Fix

on:
  push:
    branches:
      - agent/cineflow-cloud-realtime-5m
    paths:
      - '.github/workflows/cineflow-cloud-fix.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/cineflow-cloud-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cineflow-cloud-realtime-5m
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch ingest runtime semantics and long upload error
        shell: bash
        run: |
          set +e
          python projects/cineflow-cloud/scripts/patch_ingest_runtime.py
          cat projects/cineflow-cloud/patch-report.txt
          python - <<'PY'
          from pathlib import Path

          path = Path('projects/cineflow-cloud/cineflow/upload_client.py')
          text = path.read_text(encoding='utf-8')
          old = '            f"local file changed while reading part {part_number}: expected {length}, got {len(content)}"\n'
          new = (
              '            "local file changed while reading part "\n'
              '            f"{part_number}: expected {length}, got {len(content)}"\n'
          )
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          exit 0
      - name: Format and lint-fix
        shell: bash
        run: |
          set +e
          python -m pip install --quiet 'ruff>=0.9'
          ruff format projects/cineflow-cloud
          ruff check --fix --unsafe-fixes projects/cineflow-cloud
          ruff check projects/cineflow-cloud > projects/cineflow-cloud/ruff-ingest-report.txt 2>&1
          exit 0
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/cineflow-cloud
          git diff --cached --quiet && exit 0
          git commit -m 'Harden and format standalone ingest services'
          git push origin HEAD:agent/cineflow-cloud-realtime-5m
